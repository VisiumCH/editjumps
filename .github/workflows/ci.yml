name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync deps
        run: uv sync --locked --all-extras --dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run ty
        run: uv run ty check .

      - name: Test with pytest
        run: uv run pytest

  # A SECOND job, because the first one deliberately does not install the `train` group. Without
  # torch and transformers present, every tokenizer and model call type-checks as `Unknown` and ty
  # sees nothing -- which is how 20 real diagnostics in editing.py, deterministic_benchmark.py and
  # evotune_baseline.py sat on main indefinitely while CI reported green. They only became visible
  # locally, to anyone who had run `uv sync --all-groups`, where they then blocked every push.
  #
  # It runs the suite too: torch-dependent tests skip themselves in `build`.
  #
  # Kept separate rather than folded into `build` so the fast lane stays fast.
  train-group:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync deps including the train group
        run: uv sync --locked --all-extras --all-groups

      - name: Run ty with torch and transformers present
        run: uv run ty check .

      - name: Test with the torch-dependent suites active
        run: uv run pytest
