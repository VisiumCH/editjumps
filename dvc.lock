    - path: editjumps/pipeline/preprocess/pretrain/download_oas.py
      hash: md5
      md5: 3d206bb481dda5921da3e19e7145cd07
      size: 14590
    params:
      params.yaml:
        oas.collection: paired
        oas.emit_cdr_keys: true
        oas.max_len: 200
        oas.max_units:
        oas.min_len: 70
        oas.pair_chains: true
        oas.pair_sep: .
    outs:
    - path: data/pretrain/oas_corpus.cdr_keys.tsv.gz
