schema: '2.0'
stages:
  download_oas:
    cmd: uv run python -m editjumps.pipeline.preprocess.pretrain.download_oas 
      --output-folder data/pretrain --collection paired --min-len 70 --max-len 
      200 --pair-sep "." $([ "true" = "true" ] && echo --pair-chains) $([ "true"
      = "true" ] && echo --emit-cdr-keys) $([ -n "None" ] && [ "None" != "None" 
      ] && echo --max-units None)
